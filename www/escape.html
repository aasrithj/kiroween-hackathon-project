<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>Nocturne Night | Arrival</title>
    <style>
      :root { color-scheme: dark; background: #050505; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { min-height: 100svh; overflow: hidden; background: #050505; color: #fff; font: 1rem/1.5 system-ui, sans-serif; }
      main { position: fixed; inset: 0; display: grid; place-items: center; background: #050505; }
      video { width: 100%; height: 100%; object-fit: contain; }
      .skip { position: fixed; z-index: 1; right: max(1rem, env(safe-area-inset-right)); bottom: max(1rem, env(safe-area-inset-bottom)); min-height: 44px; padding: .65rem 1rem; border: 1px solid #aaa; border-radius: 999px; background: #090909e8; color: white; font: inherit; cursor: pointer; }
      .skip:focus-visible { outline: 3px solid #ff6a55; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main aria-label="Nocturne Night title introduction">
      <video id="title-intro" autoplay muted playsinline preload="auto" aria-label="Nocturne Night title sequence">
        <source src="./videos/title-sequence.webm" type="video/webm">
        <source src="./videos/title-sequence.mp4" type="video/mp4">
      </video>
    </main>
    <button class="skip" id="skip-intro" type="button">Skip intro</button>
    <noscript><p><a href="./index.html?descend">Continue to Nocturne Night</a></p></noscript>
    <script>
      (() => {
        const video = document.querySelector('#title-intro');
        const skip = document.querySelector('#skip-intro');
        const arrival = './index.html?descend';
        let leaving = false;
        let triedMp4 = false;

        const continueToArrival = () => {
          if (leaving) return;
          leaving = true;
          video.pause();
          location.replace(arrival);
        };

        video.addEventListener('ended', continueToArrival, { once: true });
        skip.addEventListener('click', continueToArrival);
        video.addEventListener('error', () => {
          if (!triedMp4 && !video.currentSrc.endsWith('.mp4')) {
            triedMp4 = true;
            video.src = './videos/title-sequence.mp4';
            video.load();
            video.play().catch(continueToArrival);
            return;
          }
          continueToArrival();
        });

        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          continueToArrival();
          return;
        }
        const playback = video.play();
        if (playback) playback.catch(continueToArrival);
      })();
    </script>
  </body>
</html>
